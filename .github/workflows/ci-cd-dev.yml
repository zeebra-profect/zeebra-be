name: Backend CI/CD - Develop

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - '**/README*'

concurrency:
  group: backend-develop
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Test & Build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      checks: write       # 테스트 리포트 작성을 위해 필요
      pull-requests: write # PR 코멘트 등을 위해 필요 (선택사항)

    services:
      postgres:
        image: postgres:14.19
        env:
          POSTGRES_USER: zeebra
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: zeebra_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeebra -d zeebra_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # (1) 단위/통합 테스트 실행 및 빌드
      # 'check'는 test뿐만 아니라 lint(checkstyle, spotless) 설정이 있다면 함께 수행합니다.
      # '-x test' 옵션을 제거하여 테스트를 수행하게 변경했습니다.
      - name: Run Tests & Build
        run: ./gradlew clean build --info

      # (2) 테스트 결과 리포팅 (JUnit5)
      # 테스트가 실패하더라도(failure) 리포트는 남겨야 하므로 if: success() || failure() 사용
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: true

#      # (3) [부가기능] 의존성 보안 취약점 검사 (Dependency Review)
#      # PR 단계에서 취약점이 있는 라이브러리가 추가되면 경고/실패 처리
#      - name: Dependency Review
#        if: github.event_name == 'pull_request'
#        uses: actions/dependency-review-action@v4

  cd:
    name: CD (Deploy to EC2 via SSM)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

#      # CD 단계에서는 테스트를 다시 돌리기보다 빠른 배포를 위해 -x test 유지 (선택사항)
#      # 만약 CD 직전에도 무조건 테스트를 통과해야 한다면 -x test 제거
#      - name: Build Spring Project
#        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          TAG=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "IMAGE_TAG=dev-${SHORT_SHA}-${TAG}" >> $GITHUB_ENV

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPO_BE_DEV }}:${IMAGE_TAG} \
                       -t ${{ secrets.ECR_REPO_BE_DEV }}:dev .
          docker push ${{ secrets.ECR_REPO_BE_DEV }}:${IMAGE_TAG}
          docker push ${{ secrets.ECR_REPO_BE_DEV }}:dev

      - name: Deploy to EC2 via SSM (pull & restart with .env)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPO_BE_DEV }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PARAM_PATH: ${{ secrets.SSM_PARAM_PATH }}
          CONTAINER_NAME: "zeebra-be"
          HOST_PORT: "8080"
          CONTAINER_PORT: "8080"
        run: |
          IMAGE_URI="${ECR_REPO}:${IMAGE_TAG}"
          TARGET_OPT="--instance-ids ${{ secrets.EC2_INSTANCE_ID }}"
          
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_URI}" \
            $TARGET_OPT \
            --parameters commands='[
              "set -eu",
              "sudo mkdir -p /opt/app && sudo mkdir -p /opt/env && sudo chown -R ubuntu:ubuntu /opt",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REPO"'",
              "docker pull '"$IMAGE_URI"'",
              "aws ssm get-parameters-by-path --path '"$PARAM_PATH"' --with-decryption --recursive --region '"$AWS_REGION"' --query \"Parameters[*].{Name:Name,Value:Value}\" --output text \
                | awk '\''{sub(\"^'"$PARAM_PATH"'\",\"\",$1); print $1\"=\"$2}'\'' > /opt/env/dev.env",
              "echo SPRING_PROFILES_ACTIVE=dev >> /opt/env/dev.env",
              "echo SERVER_PORT='"$CONTAINER_PORT"' >> /opt/env/dev.env",
              "docker stop '"$CONTAINER_NAME"' || true",
              "docker rm '"$CONTAINER_NAME"' || true",
              "docker run -d --name '"$CONTAINER_NAME"' --restart unless-stopped \
                 --env-file /opt/env/dev.env \
                 -p 127.0.0.1:'"$HOST_PORT"':'"$CONTAINER_PORT"' \
                 '"$IMAGE_URI"'",
              "sleep 2 && docker ps --filter name='"$CONTAINER_NAME"'",
              "curl -s -o /dev/null -w \"HTTP %{http_code}\\n\" http://127.0.0.1:'"$HOST_PORT"' || true"
            ]' \
            --region $AWS_REGION \
            --timeout-seconds 600