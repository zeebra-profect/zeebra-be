plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'ecommerce service profect'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.12"  // 최신 버전 확인
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-messaging'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0" // swagger 2.6.0
    implementation 'org.postgresql:postgresql'
    implementation "me.paulschwarz:spring-dotenv:4.0.0"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // 핵심 JWT 인터페이스 & 빌더 API
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5' // 실제 JWT 구현체
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JWT를 JSON으로 직렬화/역직렬화 하는데 사용

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    implementation 'com.querydsl:querydsl-core:5.0.0'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose' // 로컬 테스트용 DB 도커 컴포즈

    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation("org.assertj:assertj-core:3.27.3")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.13.4")
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1' // web push 관련 - VAPID Key 암호화
    implementation 'nl.martijndwars:web-push:5.1.1' // web push

    // 모니터링 설정
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 테스트 환경 설정
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.micrometer:micrometer-core'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus:1.14.4'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.hibernate.orm:hibernate-micrometer'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //JDBC
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    //kafka
//    implementation 'org.springframework.kafka:spring-kafka'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    // ElasticSearch
// ✅ OpenSearch 3.x용 최신 클라이언트
    implementation 'org.opensearch.client:opensearch-java:3.0.0'
    implementation 'org.opensearch.client:opensearch-rest-client:3.0.0'

    //RabbitMQ AMQP
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // STOMP Broker Relay에 필요한 Reactor Netty HTTP 클라이언트
    implementation 'org.springframework.boot:spring-boot-starter-reactor-netty'

    // (선택) Mac DNS warning 없애고 싶으면 – 버전은 Netty에 맞춰 조정
    // runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.72.Final:osx-aarch_64'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.2'

// Jackson core (대부분 이미 있지만 명확히 추가)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'

// Spring Data Elasticsearch (클래스 레벨 @Document/@Field 어노테이션 인식용)
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

// (옵션) 만약 Spring Data OpenSearch를 선호하면 위 라인 대신 아래를 사용 (버전 호환 주의)
// implementation 'org.opensearch.project:spring-data-opensearch:4.4.0'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        html.required.set(true)
    }

    def Qdomains = []
    for (qPattern in "/QA".."/QZ") {
        Qdomains.add(qPattern + "*")
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['com/zeebra/domain/**/Q*.class'] )
        }))
    }

    reports.xml.destination file("${buildDir}/jacoco/index.xml")
    reports.html.destination file("${buildDir}/jacoco/index.html")
}