input {
  jdbc {
    jdbc_connection_string => "jdbc:postgresql://127.0.0.1:5432/zeebra_db"
    jdbc_user => "zeebra"
    jdbc_password => "1234"
    jdbc_driver_library => "/Users/youn/Desktop/zeebra-be/logstash/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"

    jdbc_fetch_size => 1

    clean_run => true
    use_column_value => true
    tracking_column => "product_id"
    record_last_run => false

    statement => "SELECT
      p.product_id,
      p.product_name,
      p.model_number,
      p.product_description,
      p.brand_id,
      p.brand_name,
      p.category_id,
      p.category_name,
      p.review_count,
      p.favorite_count,
      p.updated_at,
      NOW() as created_at
    FROM product_search_document p
    ORDER BY p.product_id"
  }
}

filter {
  mutate {
    convert => {
      "product_id"     => "integer"
      "brand_id"       => "integer"
      "category_id"    => "integer"
      "review_count"   => "integer"
      "favorite_count" => "integer"
    }
  }

  # PostgreSQL timestamp 파싱
  date {
    match => ["updated_at", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"]
    target => "updated_at"
    timezone => "Asia/Seoul"
  }

  date {
    match => ["created_at", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"]
    target => "created_at"
    timezone => "Asia/Seoul"
  }

  # date_hour_minute_second 포맷에 맞게 변환 (타임존 제거)
  ruby {
    code => '
      if event.get("updated_at")
        time = event.get("updated_at").time
        event.set("updated_at", time.strftime("%Y-%m-%dT%H:%M:%S"))
      end
      if event.get("created_at")
        time = event.get("created_at").time
        event.set("created_at", time.strftime("%Y-%m-%dT%H:%M:%S"))
      end
    '
  }

  # 불필요한 필드와 tags 제거
  mutate {
    remove_field => ["@version", "@timestamp", "host", "message", "tags"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "product"
    document_id => "%{product_id}"
  }

  stdout {
    codec => rubydebug
  }

  file {
    path => "/Users/youn/Desktop/zeebra-be/logstash/debug_output.log"
    codec => json_lines
  }
}