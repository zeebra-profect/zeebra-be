input {
  jdbc {
    jdbc_connection_string => "jdbc:postgresql://127.0.0.1:5432/zeebra_db"
    jdbc_user => "zeebra"
    jdbc_password => "1234"
    jdbc_driver_library => "/Users/youn/Desktop/zeebra-be/logstash/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"

    jdbc_fetch_size => 500

    clean_run => false
    use_column_value => true
    tracking_column => "product_id"       # <-- alias 사용시 이름 맞춤
    tracking_column_type => "numeric"
    record_last_run => true
    last_run_metadata_path => "/Users/youn/.logstash_jdbc_last_run"

    statement => "
      SELECT
        p.id as product_id,
        p.id as id,                          -- (선택) 원하면 id 컬럼도 같이 내리기
        p.name as product_name,
        p.model_number,
        p.description,
        p.brand_id,
        b.name as brand_name,
        p.thumbnail as product_thumbnail,
        array_to_json(p.images) as images,   -- Postgres array를 JSON 문자열로 내려줌
        p.min_price,
        p.category_id,
        c.name as category_name,
        p.review_count,
        p.favorite_product_count,
        p.updated_time as updated_at,
        p.created_time as created_at
      FROM product p
      INNER JOIN brand b ON p.brand_id = b.id
      INNER JOIN category c ON p.category_id = c.id
      WHERE p.id > :sql_last_value
        AND p.deleted_at IS NULL
      ORDER BY p.id
    "
  }
}

filter {
  # images는 array_to_json로 내려왔으므로 json 필터로 파싱
  if [images] {
    json {
      source => "images"
      target => "images"
      remove_field => ["images"]   # 필요에 따라 유지
    }
  }

  mutate {
    convert => {
      "product_id"              => "integer"
      "brand_id"                => "integer"
      "category_id"             => "integer"
      "review_count"            => "integer"
      "favorite_product_count"  => "integer"
      "min_price"               => "float"
    }
  }

  date {
    match => ["updated_at", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"]
    target => "updated_at"
    timezone => "Asia/Seoul"
  }

  date {
    match => ["created_at", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"]
    target => "created_at"
    timezone => "Asia/Seoul"
  }

  ruby {
    code => '
      ua = event.get("updated_at")
      if ua && ua.respond_to?(:time)
        t = ua.time
        event.set("updated_at", t.strftime("%Y-%m-%dT%H:%M:%S"))
      end
      ca = event.get("created_at")
      if ca && ca.respond_to?(:time)
        t2 = ca.time
        event.set("created_at", t2.strftime("%Y-%m-%dT%H:%M:%S"))
      end
    '
  }

  mutate {
    remove_field => ["@version", "@timestamp", "host", "message", "tags"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "product"
    document_id => "%{product_id}"
  }

  stdout { codec => rubydebug }

  file {
    path => "/Users/youn/Desktop/zeebra-be/logstash/debug_output.log"
    codec => json_lines
  }
}
