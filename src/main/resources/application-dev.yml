spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  secret-key: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:zeebra-auth}
  clockSkewSec: ${JWT_CLOCK_SKEW_SEC}

logging:
  level:
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.http.converter: DEBUG

springdoc:
  packages-to-scan: com.zeebra

spring.jpa:
  hibernate.ddl-auto: update
  open-in-view: false
  properties:
    hibernate.format_sql: true
  show-sql: false

toss:
  payments:
    secret-key: ${TOSS_PAYMENT_SECRET_KEY}

vapid:
  public.key: BN6WSz7suZPHtrPslZQLuwGf1ZG80OXvnInn1iJ-MLL3HQ_rrUPe0v8Wmo6zaqMaZI_qtrPKqQRjQopPcPORQkU
  private.key: t4LDNFeIXhuonUykBoJMSJBhKBGIe873T340l51FFIY
  subject: mailto:bbyubbu@naver.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  security:
    enabled: false
